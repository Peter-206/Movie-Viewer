name: Verify Windows app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .playback/player/package-lock.json
      - name: Install locked JavaScript dependencies
        run: npm ci --prefix .playback/player
      - name: Check JavaScript syntax
        run: |
          node --check .playback/player/main.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .playback/player/preload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .playback/player/renderer.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .playback/player/host.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check .playback/verification/setup-flow.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Rust toolchain and tests
        run: |
          rustup show active-toolchain
          rustup component add rust-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path .playback/server/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows delivery with dependency notices
        run: ./.playback/build-release.ps1
      - name: Generate synthetic playback fixture
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:/ProgramData/chocolatey/bin/ffmpeg.exe -y -f lavfi -i testsrc2=s=320x180:r=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -t 45 -c:v libx264 -profile:v baseline -pix_fmt yuv420p -c:a aac -movflags +faststart .playback/verification/sample.mp4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & C:/ProgramData/chocolatey/bin/ffmpeg.exe -y -f lavfi -i color=c=blue:s=120x180 -frames:v 1 .playback/verification/cover.jpg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the extracted host and viewer package
        run: |
          Expand-Archive .playback/delivery/MovieShelf-win64.zip .playback/verification/.package-test
          node .playback/verification/setup-flow.cjs "$pwd/.playback/verification/.package-test/MovieShelf" "$pwd/.playback/verification/sample.mp4" "$pwd/.playback/verification/cover.jpg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare release assets and checksums
        run: |
          New-Item -ItemType Directory release-assets | Out-Null
          Copy-Item .playback/delivery/MovieShelf-win64.zip release-assets/
          git archive --format=zip --prefix=MovieShelf-source/ -o release-assets/MovieShelf-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Input: ZIP files. Output: Checksum lines. Goal: Verify downloads. Description: Hashes are paired with their public filenames.
          Get-FileHash release-assets/*.zip -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path -Leaf $_.Path) } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error
