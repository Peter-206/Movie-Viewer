name: Verify Windows app

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m unittest discover -s .tests -v
      - run: python -m PyInstaller --noconfirm --distpath .build-ui/dist --workpath .build-ui/work movie_shelf.spec
      - run: python .tests/verify_movie_shelf_package.py .build-ui/dist/movie_shelf.exe
