name: Prepare Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  release:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Create a draft with the tested Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          # Input: Triggering tag. Output: Tag name. Goal: Select release. Description: Passed as data rather than shell source.
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" release-assets/MovieShelf-win64.zip release-assets/MovieShelf-source.zip release-assets/SHA256SUMS.txt --verify-tag --draft --prerelease --generate-notes
